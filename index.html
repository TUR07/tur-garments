    <!-- Firebase App & Firestore Modular SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Optional Firebase config handling
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tur-garments-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (e) {
                    console.log("Firebase Auth notice: running local mode fallback.");
                }
            };
            initAuth();
        }
    </script>

                } else {
                    openAdminLoginModal();
                }

                state.selectedProduct = param;
                state.activePhotoIndex = 0;
            } else if (page === 'catalogue' && param) {
                state.filter.category = param;

            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();

            setTimeout(() => {

            document.getElementById('searchModal').classList.remove('hidden');
            document.getElementById('searchInput').focus();
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function handleSearchInput(e) {
            const query = e.target.value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            
            if (!query) {
                resultsContainer.innerHTML = `<p class="text-center text-stone-400 text-xs py-6">Type product name, code (e.g. TUR-101), color or size to search...</p>`;
                return;
            }

            const matches = state.products.filter(p => 
                p.name.toLowerCase().includes(query) ||
                p.code.toLowerCase().includes(query) ||
                p.category.toLowerCase().includes(query) ||
                (p.colors && p.colors.some(c => c.toLowerCase().includes(query))) ||
                (p.sizes && Object.keys(p.sizes).some(s => s.toLowerCase() === query && p.sizes[s]))
            );

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<p class="text-center text-stone-500 text-sm py-6">No garments found matching "${query}"</p>`;
                return;
            }

            resultsContainer.innerHTML = matches.map(p => `
                <div onclick="closeSearchModal(); navigateTo('product-detail', state.products.find(x => x.id === '${p.id}'))" class="py-3 flex items-center gap-3 hover:bg-stone-50 cursor-pointer rounded-lg px-2 transition">
                    <img src="${p.photos[0]}" class="w-12 h-12 object-cover rounded-md border border-stone-200">
                    <div class="flex-grow">
                        <h4 class="text-xs font-bold text-stone-900">${p.name}</h4>
                        <div class="flex items-center gap-2 text-[11px] text-stone-500 mt-0.5">
                            <span class="font-mono bg-stone-100 px-1.5 py-0.5 rounded">${p.code}</span>
                            <span>₹${p.price}</span>
                            <span class="text-amber-700">${p.category}</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-stone-300 text-xs"></i>
                </div>
            `).join('');

        // WhatsApp Direct Link

            const msg = customMsg || `Hello TUR Garments, I would like to inquire about your available shirt catalogue and wholesale prices.`;

        // Bulk Modal Handlers
        function openBulkModal(product) {
            document.getElementById('enquiryProductId').value = product.id;
            document.getElementById('enquiryProductName').value = `${product.name} (${product.code})`;
            document.getElementById('bulkEnquiryModal').classList.remove('hidden');
        }

        function closeBulkModal() {
            document.getElementById('bulkEnquiryModal').classList.add('hidden');
        }

        function submitBulkEnquiry(e) {
            e.preventDefault();
            const name = document.getElementById('enquiryCustomerName').value;
            const phone = document.getElementById('enquiryCustomerPhone').value;
            const productInfo = document.getElementById('enquiryProductName').value;
            const qty = document.getElementById('enquiryQuantity').value;
            const size = document.getElementById('enquirySize').value;
            const color = document.getElementById('enquiryColor').value || 'Default';
            const msg = document.getElementById('enquiryMessage').value;

            // Store in enquiries state
            const newEnquiry = {
                id: 'enq_' + Date.now(),
                customerName: name,
                customerPhone: phone,
                product: productInfo,
                quantity: qty,
                size: size,
                color: color,
                message: msg,
                date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),
                status: 'New'
            };
            
            state.enquiries.unshift(newEnquiry);
            saveStateToStorage();

            // Construct WhatsApp message
            const waText = `*BULK ENQUIRY - TUR GARMENTS*\n\n` +
                `*Name:* ${name}\n` +
                `*Phone:* ${phone}\n` +
                `*Product:* ${productInfo}\n` +
                `*Quantity:* ${qty} pcs\n` +
                `*Preferred Size:* ${size}\n` +
                `*Colour:* ${color}\n` +
                `*Note:* ${msg || 'None'}`;

            closeBulkModal();
            showToast("Bulk enquiry saved! Opening WhatsApp...");
            contactWhatsAppDirect(waText);
        }

        function submitBulkEnquiryLocallyOnly() {
            const name = document.getElementById('enquiryCustomerName').value;
            const phone = document.getElementById('enquiryCustomerPhone').value;
            if (!name || !phone) {
                showToast("Please enter your Name and Phone number");
                return;
            }
            const productInfo = document.getElementById('enquiryProductName').value;
            const qty = document.getElementById('enquiryQuantity').value;
            const size = document.getElementById('enquirySize').value;
            const color = document.getElementById('enquiryColor').value || 'Default';
            const msg = document.getElementById('enquiryMessage').value;

            state.enquiries.unshift({
                id: 'enq_' + Date.now(),
                customerName: name,
                customerPhone: phone,
                product: productInfo,
                quantity: qty,
                size: size,
                color: color,
                message: msg,
                date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),
                status: 'New'
            });
            saveStateToStorage();
            closeBulkModal();
            showToast("Your enquiry has been registered with TUR Garments!");

                if (state.filter.onlyAvailable && !p.available) return false;
                return true;

            return `

                            <button onclick="setCategoryFilter('All')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition ${state.filter.category === 'All' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}">

        function submitCustomerReview(e) {
            e.preventDefault();
            const name = document.getElementById('revName').value;
            const rating = parseInt(document.getElementById('revRating').value);
            const comment = document.getElementById('revComment').value;

            state.reviews.unshift({
                id: 'r_' + Date.now(),
                name: name,
                rating: rating,
                comment: comment,
                status: 'pending',
                date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
            });

            saveStateToStorage();
            closeAddReviewModal();
            showToast("Review submitted! Pending owner moderation.");
            render();
        }

                return `
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold text-stone-900">Review Moderation</h3>
                        ${state.reviews.map(r => `
                            <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm space-y-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-stone-900">${r.name}</span>
                                    <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded ${r.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.status}</span>
                                </div>
                                <p class="text-xs text-stone-700">${r.comment}</p>
                                <div class="flex gap-2 pt-1">
                                    <button onclick="toggleReviewStatus('${r.id}', 'approved')" class="bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg">Approve</button>
                                    <button onclick="toggleReviewStatus('${r.id}', 'hidden')" class="bg-stone-200 text-stone-800 text-[10px] font-bold px-2.5 py-1 rounded-lg">Hide</button>
                                    <button onclick="deleteReview('${r.id}')" class="bg-rose-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg">Delete</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (state.adminTab === 'settings') {
                return `
                    <div class="space-y-4">
                        <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-3">
                            <h3 class="text-sm font-bold text-stone-900">Shop Contact Details & Settings</h3>
                            <form onsubmit="saveShopSettings(event)" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-stone-700 mb-1">Shop Address</label>
                                    <input type="text" id="setAddress" value="${state.settings.address}" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-stone-700 mb-1">Phone Number</label>
                                        <input type="text" id="setPhone" value="${state.settings.phone}" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-stone-700 mb-1">WhatsApp Number</label>
                                        <input type="text" id="setWhatsapp" value="${state.settings.whatsapp}" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-stone-700 mb-1">Hero Subtext Slogan</label>
                                    <input type="text" id="setHeroSubtext" value="${state.settings.heroSubtext}" class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm">
                                </div>
                                <button type="submit" class="bg-stone-900 text-white font-bold py-2 px-4 rounded-xl text-xs">Update Settings</button>
                            </form>
                        </div>

                        <!-- CHANGE ADMIN PASSWORD -->
                        <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-3">
                            <h3 class="text-sm font-bold text-stone-900">Security Credentials</h3>
                            <form onsubmit="changeAdminCredentials(event)" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-stone-700 mb-1">Admin Username</label>
                                    <input type="text" id="chgUser" value="${state.adminAuth.username}" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-stone-700 mb-1">New Admin Password</label>
                                    <input type="password" id="chgPass" placeholder="Enter new password" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm">
                                </div>
                                <button type="submit" class="bg-stone-900 text-white font-bold py-2 px-4 rounded-xl text-xs">Update Credentials</button>
                            </form>
                        </div>
                    </div>
                `;
            }
        }

        // Product Form Handler Functions
        function openProductForm() {
            if (state.adminTab !== 'products') {
                state.adminTab = 'products';
                render();
            }

            const formBox = document.getElementById('productFormBox');
            if (!formBox) return;

            formBox.classList.remove('hidden');
            state.tempPhotos = [];

            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.value = val;
            };

            setVal('editProdId', '');
            setVal('pName', '');
            setVal('pCode', '');
            setVal('pPrice', '299');
            setVal('pColors', '');
            setVal('pFabric', '');
            setVal('pPattern', '');
            setVal('pFit', '');
            setVal('pDesc', '');

            const titleEl = document.getElementById('formTitle');
            if (titleEl) titleEl.innerText = 'Add New Garment';

            ['32','34','36','S','M','L','XL','XXL'].forEach(sz => {
                const el = document.getElementById(`sz_${sz}`);
                if (el) el.checked = true;
            });

            renderPhotoPreviews();
            formBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function closeProductForm() {
            const formBox = document.getElementById('productFormBox');
            if (formBox) formBox.classList.add('hidden');
        }

        function handleGalleryUpload(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    compressAndAddImage(evt.target.result);
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        function compressAndAddImage(dataUrl, maxDim = 800, quality = 0.75) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    }
                } else {
                    if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressed = canvas.toDataURL('image/jpeg', quality);
                state.tempPhotos.push(compressed);
                renderPhotoPreviews();
            };
            img.src = dataUrl;
        }

        function addUrlPhoto() {
            const input = document.getElementById('pUrlInput');
            if (!input) return;
            const url = input.value.trim();
            if (url) {
                state.tempPhotos.push(url);
                input.value = '';
                renderPhotoPreviews();
            } else {
                showToast("Please enter a valid image URL");
            }
        }

        function removeTempPhoto(idx) {
            state.tempPhotos.splice(idx, 1);
            renderPhotoPreviews();
        }

        function renderPhotoPreviews() {
            const container = document.getElementById('photoPreviewsContainer');
            if (!container) return;

            if (state.tempPhotos.length === 0) {
                container.innerHTML = `<span class="text-[11px] text-stone-400 italic py-2">No photos added yet. Select photos from gallery or add a web URL.</span>`;
                return;
            }

            container.innerHTML = state.tempPhotos.map((photo, idx) => `
                <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-stone-300 flex-shrink-0 group">
                    <img src="${photo}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeTempPhoto(${idx})" class="absolute top-0.5 right-0.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px] shadow hover:bg-rose-700 transition" title="Remove Photo">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <span class="absolute bottom-0 left-0 right-0 bg-stone-900/60 text-white text-[8px] text-center">${idx + 1}</span>
                </div>
            `).join('');
        }

        function saveProductForm(e) {
            e.preventDefault();
            const id = document.getElementById('editProdId').value || 'p_' + Date.now();
            const name = document.getElementById('pName').value.trim();
            const code = document.getElementById('pCode').value.trim();
            const category = document.getElementById('pCategory').value;
            const price = parseFloat(document.getElementById('pPrice').value) || 0;
            
            // Collect photos from device gallery & URLs
            let photos = [...state.tempPhotos];
            if (photos.length === 0) {
                photos = ["https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=800&q=80"];
                showToast("Default image used (no photos attached)");
            }

            const colors = document.getElementById('pColors').value.split(',').map(s => s.trim()).filter(Boolean);
            const fabric = document.getElementById('pFabric').value.trim() || '100% Cotton';
            const pattern = document.getElementById('pPattern').value.trim() || 'Plain';
            const fit = document.getElementById('pFit').value.trim() || 'Regular Fit';
            const desc = document.getElementById('pDesc').value.trim();

            const sizesObj = {};
            ['32','34','36','S','M','L','XL','XXL'].forEach(sz => {
                const el = document.getElementById(`sz_${sz}`);
                sizesObj[sz] = el ? el.checked : false;
            });

            const newProd = {
                id, name, code, category, price, available: true, isFeatured: true, isNew: true,
                fabric, pattern, fit, description: desc, sizes: sizesObj, colors, photos
            };

            const existingIdx = state.products.findIndex(p => p.id === id);
            if (existingIdx >= 0) {
                state.products[existingIdx] = newProd;
            } else {
                state.products.unshift(newProd);
            }

            saveStateToStorage();
            closeProductForm();
            showToast("Garment saved successfully!");
            render();
        }

        function editProduct(id) {
            const prod = state.products.find(p => p.id === id);
            if (!prod) return;
            openProductForm();

            const titleEl = document.getElementById('formTitle');
            if (titleEl) titleEl.innerText = `Edit Garment (${prod.code})`;

            const setVal = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.value = val;
            };

            state.tempPhotos = Array.isArray(prod.photos) ? [...prod.photos] : [];

            setVal('editProdId', prod.id);
            setVal('pName', prod.name || '');
            setVal('pCode', prod.code || '');
            setVal('pCategory', prod.category || "Men's Shirts");
            setVal('pPrice', prod.price || 0);
            setVal('pColors', (prod.colors || []).join(', '));
            setVal('pFabric', prod.fabric || '');
            setVal('pPattern', prod.pattern || '');
            setVal('pFit', prod.fit || '');
            setVal('pDesc', prod.description || '');

            ['32','34','36','S','M','L','XL','XXL'].forEach(sz => {
                const el = document.getElementById(`sz_${sz}`);
                if (el) el.checked = !!(prod.sizes && prod.sizes[sz]);
            });

            renderPhotoPreviews();
        }

        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this garment?")) {
                state.products = state.products.filter(p => p.id !== id);
                saveStateToStorage();
                showToast("Product deleted");
                render();
            }
        }

        function updateEnquiryStatus(id, newStatus) {
            const enq = state.enquiries.find(e => e.id === id);
            if (enq) {
                enq.status = newStatus;
                saveStateToStorage();
                showToast("Enquiry status updated");
            }
        }

        function toggleReviewStatus(id, newStatus) {
            const rev = state.reviews.find(r => r.id === id);
            if (rev) {
                rev.status = newStatus;
                saveStateToStorage();
                showToast("Review updated");
                render();
            }
        }

        function deleteReview(id) {
            state.reviews = state.reviews.filter(r => r.id !== id);
            saveStateToStorage();
            showToast("Review deleted");
            render();
        }

        function saveShopSettings(e) {
            e.preventDefault();
            state.settings.address = document.getElementById('setAddress').value;
            state.settings.phone = document.getElementById('setPhone').value;
            state.settings.whatsapp = document.getElementById('setWhatsapp').value;
            state.settings.heroSubtext = document.getElementById('setHeroSubtext').value;
            saveStateToStorage();
            showToast("Settings updated!");
            render();
        }

        function changeAdminCredentials(e) {
            e.preventDefault();
            const newU = document.getElementById('chgUser').value;
            const newP = document.getElementById('chgPass').value;
            state.adminAuth.username = newU;
            state.adminAuth.password = newP;
            showToast("Admin credentials updated successfully!");
        }

        function render() {
            const root = document.getElementById('appRoot');
            
            // Update bottom navigation active styles
            ['home', 'catalogue', 'contact', 'reviews'].forEach(p => {
                const navBtn = document.getElementById(`nav-${p}`);
                if (navBtn) {
                    if (state.currentPage === p) {
                        navBtn.className = "flex flex-col items-center justify-center w-1/4 py-1 text-stone-900 font-bold transition scale-105";
                    } else {
                        navBtn.className = "flex flex-col items-center justify-center w-1/4 py-1 text-stone-400 font-medium transition hover:text-stone-700";
                    }
                }
            });

            // Hide bottom nav if on Admin portal
            const bottomNav = document.getElementById('bottomNav');
            if (state.currentPage === 'admin') {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
            }

            // Page router
            switch (state.currentPage) {
                case 'home':
                    root.innerHTML = renderHome();
                    break;
                case 'catalogue':
                    root.innerHTML = renderCatalogue();
                    break;
                case 'product-detail':
                    root.innerHTML = renderProductDetail();
                    break;
                case 'contact':
                    root.innerHTML = renderContact();
                    break;
                case 'reviews':
                    root.innerHTML = renderReviews();
                    break;
                case 'admin':
                    root.innerHTML = renderAdminDashboard();
                    break;
                default:
                    root.innerHTML = renderHome();
            }
        }

        // Initial App Load Trigger
        window.onload = function() {
            checkHashRoute();
            render();
        };
    </script>
</body>
</html>
